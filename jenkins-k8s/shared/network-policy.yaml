# Allow all pods in utilities namespace to communicate with each other
# and resolve DNS — needed for SonarQube→PostgreSQL, Jenkins→SonarQube, etc.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-jenkins-ci-internal
  namespace: utilities
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - sonarqube
      - postgres
      - nexus
      - postfix
      - jenkins-b
      - jenkins-c
      - android-build-agent
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - sonarqube
          - postgres
          - nexus
          - postfix
          - jenkins-b
          - jenkins-c
          - android-build-agent
  egress:
  - to:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - sonarqube
          - postgres
          - nexus
          - postfix
          - jenkins-b
          - jenkins-c
          - android-build-agent
  # Allow DNS
  - to: []
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  # Allow kubelet health probes (from host network)
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 10.244.0.0/16
