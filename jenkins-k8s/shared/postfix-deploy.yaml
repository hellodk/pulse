apiVersion: apps/v1
kind: Deployment
metadata:
  name: postfix
  namespace: utilities
  labels:
    app: postfix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postfix
  template:
    metadata:
      labels:
        app: postfix
    spec:
      containers:
      - name: postfix
        image: boky/postfix:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 25
        env:
        # boky/postfix relay configuration — STARTTLS to Mailtrap on port 587
        - name: RELAYHOST
          value: "[live.smtp.mailtrap.io]:587"
        - name: RELAYHOST_USERNAME
          valueFrom:
            secretKeyRef:
              name: mailtrap-smtp-creds
              key: username
        - name: RELAYHOST_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mailtrap-smtp-creds
              key: password
        - name: ALLOWED_SENDER_DOMAINS
          value: "hellodk.io jenkins-ci.hellodk.io"
        - name: POSTFIX_myhostname
          value: "jenkins-ci.hellodk.io"
        readinessProbe:
          tcpSocket:
            port: 25
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 25
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: smtp
  namespace: utilities
spec:
  selector:
    app: postfix
  ports:
  - port: 25
    targetPort: 25
    protocol: TCP
