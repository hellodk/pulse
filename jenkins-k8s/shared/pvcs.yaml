# NFS-backed (rpi 192.168.1.118 via nfs-client SC) replacements for former hostPaths.
# Shared by jenkins-c and android-build-agent -> ReadWriteMany.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pulse-repo
  namespace: utilities
spec:
  accessModes: [ReadWriteMany]
  storageClassName: nfs-client
  resources:
    requests:
      storage: 5Gi
