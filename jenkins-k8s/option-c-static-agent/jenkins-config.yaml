apiVersion: v1
kind: ConfigMap
metadata:
  name: jenkins-c-init
  namespace: utilities
data:
  01-security.groovy: |
    import jenkins.model.*
    import hudson.security.*

    def instance = Jenkins.getInstance()
    def realm = new HudsonPrivateSecurityRealm(false)
    realm.createAccount("admin", "admin123")
    instance.setSecurityRealm(realm)

    def strategy = new FullControlOnceLoggedInAuthorizationStrategy()
    strategy.setAllowAnonymousRead(false)
    instance.setAuthorizationStrategy(strategy)
    instance.save()

  02-node.groovy: |
    import jenkins.model.*
    import hudson.model.*
    import hudson.slaves.*

    def instance = Jenkins.getInstance()
    def nodeName = "android-agent"
    if (instance.getNode(nodeName) == null) {
      def slave = new DumbSlave(
        nodeName,
        "Android Build Agent — Option C static JNLP",
        "/home/jenkins/agent",
        "2",
        Node.Mode.EXCLUSIVE,
        "android-agent",
        new JNLPLauncher(true),
        new RetentionStrategy.Always()
      )
      instance.addNode(slave)
      instance.save()
      println "Created node: ${nodeName}"
    } else {
      println "Node already exists: ${nodeName}"
    }

  03-smtp.groovy: |
    // No static imports — plugin classes may not be in Groovy classpath at init time.
    // Use string-based descriptor lookup and dynamic method calls instead.
    def inst = jenkins.model.Jenkins.getInstance()
    def brevoPass = System.getenv("BREVO_SMTP_PASSWORD") ?: ""
    def secret = hudson.util.Secret.fromString(brevoPass)

    // ── Mailer plugin ────────────────────────────────────────────────────
    def mailerDesc = inst.getDescriptor("hudson.tasks.Mailer")
    if (mailerDesc) {
        mailerDesc.setSmtpHost("smtp-relay.brevo.com")
        mailerDesc.setSmtpPort("587")
        mailerDesc.setUseSsl(false)
        if (mailerDesc.metaClass.respondsTo(mailerDesc, "setUseTls", boolean)) {
            mailerDesc.setUseTls(true)
        }
        mailerDesc.setSmtpAuthUserName("a98477001@smtp-brevo.com")
        mailerDesc.setSmtpAuthPassword(secret)
        mailerDesc.setReplyToAddress("a98477001@smtp-brevo.com")
        mailerDesc.save()
        println "Mailer configured — smtp-relay.brevo.com:587"
    }

    // ── Extended Email Publisher plugin ──────────────────────────────────
    try {
        def extDescClass = Thread.currentThread().contextClassLoader
            .loadClass("hudson.plugins.emailext.ExtendedEmailPublisherDescriptor")
        def extDesc = inst.getDescriptorByType(extDescClass)
        def accountClass = Thread.currentThread().contextClassLoader
            .loadClass("hudson.plugins.emailext.MailAccount")
        def account = accountClass.newInstance()
        account.setSmtpHost("smtp-relay.brevo.com")
        account.setSmtpPort("587")
        account.setUseSsl(false)
        account.setUseTls(true)
        account.setSmtpUsername("a98477001@smtp-brevo.com")
        account.setSmtpPassword(secret)
        account.setDefaultAccount(true)
        extDesc.setMailAccount(account)
        extDesc.setDefaultReplyTo("a98477001@smtp-brevo.com")
        extDesc.save()
        println "ExtendedEmail configured — smtp-relay.brevo.com:587"
    } catch (e) {
        println "ExtendedEmail config skipped: ${e.message}"
    }

    inst.setSystemMessage("Jenkins CI")
    inst.setSystemAdminMailAddress("a98477001@smtp-brevo.com")
    inst.save()
    println "SMTP configured — direct Brevo (smtp-relay.brevo.com:587 STARTTLS)"

  04-sonarqube.groovy: |
    import jenkins.model.*
    import hudson.plugins.sonar.*
    import hudson.plugins.sonar.model.*
    import com.cloudbees.plugins.credentials.*
    import com.cloudbees.plugins.credentials.domains.*
    import org.jenkinsci.plugins.plaincredentials.impl.*
    import hudson.util.Secret

    def instance = Jenkins.getInstance()

    // Add SonarQube token credential
    def credStore = SystemCredentialsProvider.getInstance().getStore()
    def sonarCred = new StringCredentialsImpl(
        CredentialsScope.GLOBAL,
        "sonar-token",
        "SonarQube authentication token",
        Secret.fromString("sqa_cfe7995abde81c39e8943c221fb238fb18654b90")
    )
    credStore.addCredentials(Domain.global(), sonarCred)

    // Add Nexus credentials
    def nexusCred = new UsernamePasswordCredentialsImpl(
        CredentialsScope.GLOBAL,
        "nexus-creds",
        "Nexus Repository OSS credentials",
        "admin",
        "admin123"
    )
    credStore.addCredentials(Domain.global(), nexusCred)

    // Configure SonarQube server
    def sonarDesc = instance.getDescriptorByType(SonarGlobalConfiguration.class)
    def sonarInstall = new SonarInstallation(
        "SonarQube",
        "http://sonarqube.utilities.svc.cluster.local:9000",
        "sonar-token",
        "", "", "", "", "", null
    )
    sonarDesc.setInstallations(sonarInstall)
    sonarDesc.save()
    println "SonarQube configured"
